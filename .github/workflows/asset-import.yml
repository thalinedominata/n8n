name: Asset import

on:
  workflow_dispatch:
    inputs:
      url:
        description: Source URL of the asset to fetch
        required: true
        type: string
      path:
        description: Repo path to write the asset to
        required: true
        type: string

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch asset
        run: |
          mkdir -p "$(dirname "${{ inputs.path }}")"
          curl -fsSL "${{ inputs.url }}" -o "${{ inputs.path }}"
          ls -la "${{ inputs.path }}"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${{ inputs.path }}"
          git commit -m "chore: import asset ${{ inputs.path }}"
          git push
