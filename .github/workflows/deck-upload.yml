name: Deck upload

on:
  push:
    branches:
      - 'claude/**'
    paths:
      - '.github/workflows/deck-upload.yml'

env:
  TRANSFER_URL: https://at.adobe.com/viGfywqLuRtasWUP

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PUT deck to storage transfer URL
        run: |
          curl -sS -o /dev/null -w "PUT status: %{http_code}\n" -L -X PUT "$TRANSFER_URL" \
            -H "Content-Type: text/html" \
            --data-binary @go-bot/.design-refs/products-deck.html
